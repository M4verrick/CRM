spring:
  config:
    activate:
      on-profile: local
  server:
    port: 8080
    address: 127.0.0.1
  datasource:
    url: jdbc:postgresql://db:5432/crmdb
    username: crmappuser
    password: crmapppassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.ap-southeast-1.amazonaws.com/ap-southeast-1_ya55bZ0sg

allowed:
  origins: http://localhost:3000
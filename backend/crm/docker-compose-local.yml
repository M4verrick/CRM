version: '3.8'

services:
  app:
    image: crm-app
    container_name: crm_app
    build:
      context: .
      dockerfile: Dockerfile-local
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - CLOUDWATCH_URI=http://localstack:4566

  db:
    image: postgres:16
    container_name: crm_db
    environment:
      POSTGRES_DB: crmdatabase
      POSTGRES_USER: crmappuser
      POSTGRES_PASSWORD: crmapppassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=logs,ses
      - DEFAULT_REGION=ap-southeast-1
    volumes:
      - ./localstack/cloudwatch.sh:/docker-entrypoint-initaws.d/cloudwatch.sh

volumes:
  db_data:
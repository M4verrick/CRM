services:
  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=logs,ses
      - DEFAULT_REGION=ap-southeast-1
    volumes:
      - "./scripts/localstack/cloudwatch.sh:/etc/localstack/init/ready.d/init-aws.sh"
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itsag3t1-crm-ingress
  namespace: itsag3t1-crm
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://www.itsag3t1.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Accept, Content-Type"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "http-cookie"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  ingressClassName: nginx
  rules:
    - host: www.itsag3t1.com
      http:
        paths:
          - path: /home
            pathType: Prefix
            backend:
              service:
                name: itsag3t1-crm-frontend
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: itsag3t1-crm-backend
                port:
                  name: http
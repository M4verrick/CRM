apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itsag3t1-crm-ingress
  namespace: itsag3t1-crm
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://www.itsag3t1.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Accept, Content-Type"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "http-cookie"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/server-snippet: |
      error_page 500 502 503 504 = @retry;
      proxy_intercept_errors on;
      
      location @retry {
        proxy_next_upstream_tries   1;
        proxy_set_header            Host www.itsag3t1.com;
        proxy_set_header            Connection "";
        proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header            X-Original-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header            X-Original-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass                  $scheme://www.itsag3t1.com;
        proxy_intercept_errors      off;
      }
spec:
  ingressClassName: nginx
  rules:
    - host: www.itsag3t1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: itsag3t1-crm-frontend
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: itsag3t1-crm-backend
                port:
                  name: http
          - path: /transaction
            pathType: Prefix
            backend:
              service:
                name: itsag3t1-crm-backend-feature4
                port:
                  name: http
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: itsag3t1-crm
  name: itsag3t1-crm-frontend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: itsag3t1-crm-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itsag3t1-crm-frontend
    spec:
      containers:
      - image: public.ecr.aws/t2p9h2o6/itsag3t1/frontend:621ddfa95dc1a041fd4fba5dbb96882935cdf542
        name: itsag3t1-crm-frontend
        ports:
        - containerPort: 3000
          name: http
---
apiVersion: v1
kind: Service
metadata:
  namespace: itsag3t1-crm
  name: itsag3t1-crm-frontend
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
  selector:
    app.kubernetes.io/name: itsag3t1-crm-frontend

---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  role: karpenter-itsag3t1-crm
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: itsag3t1-crm
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: itsag3t1-crm
  tags:
    karpenter.sh/discovery: itsag3t1-crm
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["t"]
        - key: "karpenter.k8s.aws/instance-cpu"
          operator: In
          values: ["2"]
        - key: "karpenter.k8s.aws/instance-hypervisor"
          operator: In
          values: ["nitro"]
        - key: "karpenter.k8s.aws/instance-generation"
          operator: In
          values: ["3"]
  limits:
    cpu: 10000
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        run: aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 351854075744.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Build the Docker image
        run: docker build ./backend/crm --file ./backend/crm/Dockerfile --tag itsag3t1/backend:${{ github.sha }}

      - name: Tag the Docker image
        run: docker tag itsag3t1/backend:${{ github.sha }} public.ecr.aws/t2p9h2o6/itsag3t1/backend:latest

      - name: Push the Docker image
        run: docker push public.ecr.aws/t2p9h2o6/itsag3t1/backend:latest


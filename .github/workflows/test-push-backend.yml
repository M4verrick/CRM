name: Backend Tests

on:
  push:
    branches: [ "*" ]
    paths:
      - 'backend/crm'
      - '.github/workflows/build-push-ecr-backend.yml'
      - '.github/workflows/test-push-backend.yml'
  pull_request:
    branches: [ "*" ]
    paths:
      - 'backend/crm'
      - '.github/workflows/build-push-ecr-backend.yml'
      - '.github/workflows/test-push-backend.yml'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: cd backend/crm && mvn test